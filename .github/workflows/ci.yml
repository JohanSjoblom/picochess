name: CI

on: [push]

jobs:
  pylama:
    runs-on: ubuntu-22.04
   
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install tox
      run: pip install tox
    - name: Run linting with tox
      run: tox -e lint
        
  mypy:
    continue-on-error: true  # informational baseline; not a required CI gate yet
    runs-on: ubuntu-22.04
   
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install tox
      run: pip install tox
    - name: Run type checks with tox
      run: tox -e static
        
  unittest:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install tox
      run: pip install tox
    - name: Run unit tests with tox
      run: tox -e unit
