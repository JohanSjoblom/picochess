<!doctype html>
<html lang="en" data-theme="{{ 'light' if theme == 'light' else 'dark' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#252a2f">
    <title>Picochess Clock</title>
    <link rel="shortcut icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <style>
        :root {
            color-scheme: dark;
            --case: #252a2f;
            --case-edge: #101316;
            --lcd: #c8ca9e;
            --lcd-text: #222b20;
            --button: #515960;
            --button-active: #68737b;
            --accent: #e7a42d;
            --page-padding: clamp(8px, 3vw, 24px);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            height: 100svh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: var(--page-padding);
            background: #101214;
            color: #f4f5f6;
            font-family: system-ui, sans-serif;
        }

        .clock-case {
            width: auto;
            max-width: 100%;
            height: min(100%, 410px);
            aspect-ratio: 1.65;
            min-height: 0;
            display: grid;
            container-type: inline-size;
            grid-template-rows: auto 1fr auto;
            gap: clamp(8px, 2.4cqw, 18px);
            padding: clamp(12px, 4cqw, 28px);
            border: 3px solid var(--case-edge);
            border-radius: 18px;
            background: linear-gradient(145deg, #3c444a, var(--case));
            box-shadow: inset 0 2px 1px rgba(255, 255, 255, .12), 0 14px 35px rgba(0, 0, 0, .55);
        }

        #lever {
            justify-self: center;
            width: min(82%, 440px);
            min-height: clamp(30px, 8cqw, 48px);
            border-radius: 8px 8px 3px 3px;
            background: linear-gradient(180deg, #121517, #3b4247 45%, #171b1e);
            box-shadow: inset 0 2px 1px rgba(255, 255, 255, .16), 0 3px 0 #101214;
            color: #d8dde0;
            font-size: clamp(.72rem, 2.4cqw, 1rem);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        #lever.lever-right { transform: translateX(3px) rotate(1deg); }

        .lcd {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
            padding: clamp(8px, 2.5cqw, 20px) clamp(4px, 1.5cqw, 12px);
            border: clamp(4px, 1.4cqw, 7px) solid #15191b;
            border-radius: 7px;
            background: linear-gradient(135deg, #b6b98d, var(--lcd));
            box-shadow: inset 0 0 18px rgba(38, 44, 32, .38);
            color: var(--lcd-text);
        }

        #clock-text {
            display: grid;
            width: 100%;
            min-width: 0;
            align-items: center;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            font-family: "Courier New", monospace;
            font-size: clamp(1.3rem, 8.5cqw, 3.6rem);
            font-weight: 700;
            letter-spacing: -.08em;
            line-height: 1;
            white-space: nowrap;
        }

        #clock-text .ctime-l, #clock-text .ctime-r { min-width: 0; text-align: center; }
        #clock-text .ctime-inactive { opacity: .4; }
        #clock-text .fa { flex: 0 0 auto; font-size: .48em; opacity: .55; }

        .controls {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: clamp(3px, 1.4cqw, 10px);
            padding: clamp(4px, 1.2cqw, 8px);
            border-radius: 7px;
            background: #161a1d;
        }

        button {
            min-width: 44px;
            min-height: clamp(42px, 9cqw, 60px);
            border: 2px solid #1d2226;
            border-radius: 5px;
            background: linear-gradient(145deg, #68727a, var(--button));
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .22), 0 3px 0 #161a1d;
            color: white;
            cursor: pointer;
            font-size: clamp(1rem, 4.6cqw, 1.6rem);
            touch-action: manipulation;
        }

        button:hover, button:focus-visible { background: var(--button-active); outline: 2px solid var(--accent); outline-offset: 2px; }
        button:active { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(0, 0, 0, .4), 0 1px 0 #161a1d; }
        #center { background: linear-gradient(145deg, #dcad4d, #b77c16); }
        #connection { min-height: 1em; margin: 3px 0 -2px; text-align: center; color: #aeb5ba; font-size: .72rem; }

        @media (orientation: landscape) and (max-height: 500px) {
            body { padding: 8px; }

            .clock-case {
                width: auto;
                max-width: 100%;
                height: min(410px, calc(100svh - 16px));
            }
        }
    </style>
</head>
<body>
    <main class="clock-case" aria-label="Picochess clock">
        <button type="button" id="lever" title="Switch sides" aria-label="Switch sides">Lever</button>
        <section class="lcd" aria-live="polite" aria-label="Clock" role="timer">
            <div id="clock-text">--:--</div>
        </section>
        <div>
            <div class="controls" aria-label="Clock controls">
                <button type="button" id="left" title="Last move or menu up" aria-label="Last move or menu up"><i class="fa fa-caret-left" aria-hidden="true"></i></button>
                <button type="button" id="evaluation" title="Show evaluation" aria-label="Show evaluation"><i class="fa fa-bar-chart-o" aria-hidden="true"></i></button>
                <button type="button" id="center" title="Pause, resume, or menu select" aria-label="Pause, resume, or menu select"><i class="fa fa-play" aria-hidden="true"></i></button>
                <button type="button" id="hint" title="Show hint" aria-label="Show hint"><i class="fa fa-lightbulb-o" aria-hidden="true"></i></button>
                <button type="button" id="right" title="Open menu or menu down" aria-label="Open menu or menu down"><i class="fa fa-caret-right" aria-hidden="true"></i></button>
            </div>
            <p id="connection" aria-live="polite"></p>
        </div>
    </main>
    <script>
        (() => {
            const clockText = document.getElementById('clock-text');
            const connection = document.getElementById('connection');
            const centerButton = document.getElementById('center');
            const leverButton = document.getElementById('lever');
            let leverRight = false;

            const updateClock = (text, running) => {
                if (typeof text === 'string' && text) clockText.innerHTML = text;
                if (typeof running === 'boolean') {
                    const icon = centerButton.querySelector('.fa');
                    icon.classList.toggle('fa-pause', running);
                    icon.classList.toggle('fa-play', !running);
                    centerButton.title = running ? 'Pause clock' : 'Resume clock';
                    centerButton.setAttribute('aria-label', centerButton.title);
                }
            };

            const channel = (action, extra = {}) => {
                const body = new URLSearchParams({ action, ...extra });
                return fetch('/channel', { method: 'POST', body }).catch(() => {
                    connection.textContent = 'Control unavailable';
                });
            };

            leverButton.addEventListener('click', () => {
                leverRight = !leverRight;
                leverButton.classList.toggle('lever-right', leverRight);
                channel('clockbutton', { button: leverRight ? '64' : '-64' });
            });
            document.getElementById('left').addEventListener('click', () => channel('clockbutton', { button: '0' }));
            document.getElementById('evaluation').addEventListener('click', () => channel('clockbutton', { button: '1' }));
            document.getElementById('center').addEventListener('click', () => channel('clockbutton', { button: '2' }));
            document.getElementById('hint').addEventListener('click', () => channel('clockbutton', { button: '3' }));
            document.getElementById('right').addEventListener('click', () => channel('clockbutton', { button: '4' }));

            fetch('/info?action=get_clock_text').then((response) => response.text()).then((text) => updateClock(text)).catch(() => {});
            fetch('/info?action=get_clock_state').then((response) => response.json()).then((state) => updateClock(null, Boolean(state.running))).catch(() => {});

            const connect = () => {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const socket = new WebSocket(protocol + '//' + location.host + '/event');
                socket.onopen = () => { connection.textContent = ''; };
                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === 'Clock') updateClock(data.msg, data.running);
                };
                socket.onclose = () => {
                    connection.textContent = 'Reconnecting…';
                    window.setTimeout(connect, 2000);
                };
                socket.onerror = () => socket.close();
            };
            connect();
        })();
    </script>
</body>
</html>
